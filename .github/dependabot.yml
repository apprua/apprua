# Keeps the libraries, the GitHub actions and the base image up to date: one grouped pull request a month each.
# Major versions of libraries and of Node.js can break things: they are not proposed here and are done by hand,
# one at a time (Node.js stays on a long-term-support version, an even number).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      libraries:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
